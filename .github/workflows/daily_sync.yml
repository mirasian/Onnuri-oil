name: Opinet Daily Auto Sync

on:
  schedule:
    - cron: '30 22 * * *' # 한국 시간 매일 07:30
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 및 브라우저 설치
        run: |
          pip install playwright pandas openpyxl xlrd lxml html5lib beautifulsoup4 google-api-python-client google-auth
          playwright install --with-deps chromium

      - name: 유가 다운로드 및 구글 시트 갱신 실행
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python main.py
