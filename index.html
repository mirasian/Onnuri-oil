<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 다이내믹 아일랜드 및 노치 끝까지 꽉 채우기 위한 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>온누리상품권 주유맵</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 파비콘 및 홈 화면 아이콘 -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- 카카오맵 JavaScript SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c42d4b9380996995f8fabb3d2cdaaf8f&libraries=services"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: #000000;
    }
    
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    /* 지도가 노치/다이내믹 아일랜드 영역 끝까지 100% 밀착 */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 상단 헤더: 다이내믹 아일랜드 아래 플로팅 유지 */
    .top-header {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 12px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-brand { display: flex; align-items: center; gap: 8px; }
    .app-logo { width: 24px; height: 24px; border-radius: 6px; }
    .app-title { font-size: 15px; font-weight: 800; color: #1a73e8; letter-spacing: -0.3px; }

    .fuel-selector { display: flex; background: rgba(0,0,0,0.06); padding: 3px; border-radius: 10px; gap: 2px; }
    .fuel-btn {
      padding: 6px 11px; border: none; background: transparent;
      border-radius: 8px; font-size: 12px; font-weight: 700; color: #5f6368; cursor: pointer; transition: all 0.2s;
    }
    .fuel-btn.active { background: #1a73e8; color: #fff; box-shadow: 0 2px 6px rgba(26,115,232,0.35); }

    /* GPS 내 위치 버튼 */
    .gps-btn {
      position: absolute;
      right: 16px;
      bottom: 280px;
      z-index: 10;
      background: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: bottom 0.1s, transform 0.1s;
    }
    .gps-btn:active { transform: scale(0.92); }

    /* 미니 가격 마커 */
    .mini-price-badge {
      background: #1a73e8; color: #ffffff; padding: 3px 7px; border-radius: 12px;
      font-size: 11px; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      border: 1.5px solid #ffffff; cursor: pointer; white-space: nowrap; transition: transform 0.15s;
    }
    .mini-price-badge:hover { transform: scale(1.1); z-index: 15; }
    .mini-price-badge.selected { background: #d93025; border-color: #ffebee; transform: scale(1.15); z-index: 20; }

    /* 하단 바텀시트 */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 270px;
      min-height: 130px;
      max-height: 85%;
      z-index: 10;
      background: #ffffff;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    
    .drag-handle-area {
      width: 100%;
      padding: 10px 0 6px 0;
      cursor: grab;
      touch-action: none;
      display: flex;
      justify-content: center;
      user-select: none;
    }
    .drag-handle-area:active { cursor: grabbing; }
    .sheet-handle { width: 42px; height: 4px; background: #dcdfe6; border-radius: 3px; pointer-events: none; }
    
    .sort-bar {
      display: flex; gap: 6px; padding: 4px 14px 10px 14px; overflow-x: auto; border-bottom: 1px solid #f0f0f0;
      scrollbar-width: none; flex-shrink: 0; user-select: none;
    }
    .sort-bar::-webkit-scrollbar { display: none; }
    .sort-btn {
      padding: 5px 10px; border: 1px solid #dadce0; background: #ffffff;
      border-radius: 20px; font-size: 11px; font-weight: 600; color: #3c4043; cursor: pointer; white-space: nowrap;
    }
    .sort-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; }

    /* 하단 주유소 목록: 하단 그라데이션 없이 마지막 카드가 완전히 보이도록 패딩 확보 */
    .station-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px calc(90px + env(safe-area-inset-bottom)) 14px;
      -webkit-overflow-scrolling: touch;
    }

    .station-card {
      padding: 12px 14px; background: #ffffff; border: 1px solid #f1f3f4; border-radius: 14px;
      margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
    }
    .station-card:hover, .station-card:active { background: #f8fafd; border-color: #d2e3fc; }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-name-wrap { display: flex; align-items: center; gap: 6px; }
    .card-name { font-size: 14px; font-weight: 700; color: #202124; letter-spacing: -0.2px; }
    .self-tag { font-size: 10px; font-weight: 700; color: #0d904f; background: #e6f4ea; padding: 1px 4px; border-radius: 4px; }
    .card-dist { font-size: 12px; font-weight: 700; color: #1a73e8; background: #e8f0fe; padding: 2px 7px; border-radius: 6px; }
    
    .card-prices { display: flex; gap: 14px; font-size: 12px; color: #5f6368; }
    .price-item { display: flex; flex-direction: column; gap: 1px; }
    .price-item span:first-child { font-size: 10px; color: #80868b; }
    .price-item span:last-child { font-weight: 600; color: #3c4043; font-size: 12px; }
    .price-item.highlight span:first-child { color: #d93025; font-weight: 700; }
    .price-item.highlight span:last-child { color: #d93025; font-size: 13px; font-weight: 800; }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="top-header">
      <div class="app-brand">
        <img src="favicon.png" alt="logo" class="app-logo" onerror="this.style.display='none'">
        <div class="app-title">온누리 주유맵</div>
      </div>
      <div class="fuel-selector">
        <button class="fuel-btn active" onclick="setFuelType('gasoline')">휘발유</button>
        <button class="fuel-btn" onclick="setFuelType('diesel')">경유</button>
        <button class="fuel-btn" onclick="setFuelType('premium')">고급유</button>
      </div>
    </div>

    <button class="gps-btn" id="gps-btn" onclick="moveToCurrentLocation()" title="내 위치 이동">📍</button>
    <div id="map"></div>

    <div class="bottom-sheet" id="bottom-sheet">
      <div class="drag-handle-area" id="drag-handle">
        <div class="sheet-handle"></div>
      </div>
      <div class="sort-bar">
        <button class="sort-btn active" id="sort-gasoline" onclick="setSortMode('gasoline')">휘발유 최저가순</button>
        <button class="sort-btn" id="sort-diesel" onclick="setSortMode('diesel')">경유 최저가순</button>
        <button class="sort-btn" id="sort-premium" onclick="setSortMode('premium')">고급유 최저가순</button>
        <button class="sort-btn" id="sort-distance" onclick="setSortMode('distance')">가까운 거리순</button>
      </div>
      
      <div class="station-list" id="station-list">
        <div style="text-align:center; padding: 24px; color:#888; font-size:13px;">주유소 데이터를 불러오는 중...</div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxS40AsAhGwKqwcquTnxUWMmWKfULb7FGE_5JIlLkwhyb9IBa2bNSZdYiKE9zuGs9cP/exec";

    let map, geocoder;
    let myLat = 35.1595, myLng = 126.8526;
    let myLocationMarker = null;
    let stationData = [];
    let activeCustomOverlays = [];
    let selectedFuel = 'gasoline';
    let currentSort = 'gasoline';
    let selectedStationId = null;

    const mapContainer = document.getElementById('map');
    const mapOption = { center: new kakao.maps.LatLng(myLat, myLng), level: 5 };
    map = new kakao.maps.Map(mapContainer, mapOption);
    geocoder = new kakao.maps.services.Geocoder();

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function cleanAddress(addr) {
      if (!addr) return "";
      return String(addr)
        .replace("전남광주통합특별시", "광주광역시")
        .replace("전남광주", "광주광역시")
        .replace(/\(.*?\)/g, "")
        .trim();
    }

    function updateMyLocationMarker(lat, lng) {
      const locPosition = new kakao.maps.LatLng(lat, lng);
      if (!myLocationMarker) {
        const imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png';
        const imageSize = new kakao.maps.Size(24, 35);
        const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        myLocationMarker = new kakao.maps.Marker({
          map: map,
          position: locPosition,
          image: markerImage,
          zIndex: 30
        });
      } else {
        myLocationMarker.setPosition(locPosition);
      }
    }

    async function initData() {
      try {
        const res = await fetch(APPS_SCRIPT_API_URL);
        const list = await res.json();
        
        if (!list || list.length === 0) {
          document.getElementById('station-list').innerHTML = `<div style="text-align:center; padding:20px; color:#888;">온누리 주유소 데이터가 없습니다.</div>`;
          return;
        }

        stationData = list.map((st, idx) => ({
          id: st.id || `st_${idx}`,
          name: st.name || "주유소",
          brand: st.brand || "",
          address: st.address || "",
          gasoline: st.gasoline || "",
          diesel: st.diesel || "",
          premium: st.premium || "",
          isSelf: st.isSelf || "",
          lat: null,
          lng: null,
          distance: 9999
        }));

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            myLat = pos.coords.latitude;
            myLng = pos.coords.longitude;
            map.setCenter(new kakao.maps.LatLng(myLat, myLng));
            updateMyLocationMarker(myLat, myLng);
            updateDistances();
            renderStationList();
          });
        }

        renderStationList();

        let geocodeCount = 0;
        stationData.forEach(item => {
          const searchAddr = cleanAddress(item.address);
          if (!searchAddr) return;

          geocoder.addressSearch(searchAddr, (result, status) => {
            if (status === kakao.maps.services.Status.OK) {
              item.lat = parseFloat(result[0].y);
              item.lng = parseFloat(result[0].x);
              item.distance = calcDistance(myLat, myLng, item.lat, item.lng);
              createMarker(item);
            }
            geocodeCount++;
            if (geocodeCount % 5 === 0 || geocodeCount === stationData.length) {
              renderStationList();
            }
          });
        });
      } catch (err) {
        console.error("로드 실패:", err);
      }
    }

    function updateDistances() {
      stationData.forEach(st => {
        if (st.lat && st.lng) {
          st.distance = calcDistance(myLat, myLng, st.lat, st.lng);
        }
      });
    }

    function createMarker(st) {
      let rawPrice = selectedFuel === 'gasoline' ? st.gasoline : (selectedFuel === 'diesel' ? st.diesel : st.premium);
      const numPrice = Number(rawPrice);

      if (!numPrice || numPrice === 0) return;

      const isSelected = st.id === selectedStationId;
      const content = document.createElement('div');
      content.className = `mini-price-badge ${isSelected ? 'selected' : ''}`;
      content.innerHTML = `${numPrice.toLocaleString()}`;

      content.onclick = () => focusStation(st);

      const customOverlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(st.lat, st.lng),
        content: content,
        yAnchor: 0.5,
        zIndex: isSelected ? 20 : 10
      });

      customOverlay.setMap(map);
      activeCustomOverlays.push(customOverlay);
    }

    function renderMapMarkers() {
      activeCustomOverlays.forEach(overlay => overlay.setMap(null));
      activeCustomOverlays = [];
      stationData.forEach(st => {
        if (st.lat && st.lng) createMarker(st);
      });
    }

    function renderStationList() {
      const listEl = document.getElementById('station-list');
      let sorted = [...stationData];

      if (currentSort === 'gasoline') {
        sorted.sort((a, b) => (Number(a.gasoline) || 99999) - (Number(b.gasoline) || 99999));
      } else if (currentSort === 'diesel') {
        sorted.sort((a, b) => (Number(a.diesel) || 99999) - (Number(b.diesel) || 99999));
      } else if (currentSort === 'premium') {
        sorted.sort((a, b) => (Number(a.premium) || 99999) - (Number(b.premium) || 99999));
      } else if (currentSort === 'distance') {
        sorted.sort((a, b) => a.distance - b.distance);
      }

      if (sorted.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:20px; color:#888;">표시할 주유소가 없습니다.</div>`;
        return;
      }

      listEl.innerHTML = sorted.map(st => {
        const distStr = (st.distance && st.distance < 1000) ? `${st.distance.toFixed(1)}km` : '';
        const gasStr = (st.gasoline && st.gasoline != 0) ? `${Number(st.gasoline).toLocaleString()}원` : '-';
        const dieselStr = (st.diesel && st.diesel != 0) ? `${Number(st.diesel).toLocaleString()}원` : '-';
        const premStr = (st.premium && st.premium != 0) ? `${Number(st.premium).toLocaleString()}원` : '-';
        const isSelf = st.isSelf === '셀프';

        return `
          <div class="station-card" onclick='focusStationById("${st.id}")'>
            <div class="card-top">
              <div class="card-name-wrap">
                <span class="card-name">${st.name}</span>
                ${isSelf ? '<span class="self-tag">셀프</span>' : ''}
                <small style="color:#80868b; font-size:11px;">${st.brand || ''}</small>
              </div>
              ${distStr ? `<span class="card-dist">${distStr}</span>` : ''}
            </div>
            <div class="card-prices">
              <div class="price-item ${selectedFuel === 'gasoline' ? 'highlight' : ''}">
                <span>휘발유</span>
                <span>${gasStr}</span>
              </div>
              <div class="price-item ${selectedFuel === 'diesel' ? 'highlight' : ''}">
                <span>경유</span>
                <span>${dieselStr}</span>
              </div>
              <div class="price-item ${selectedFuel === 'premium' ? 'highlight' : ''}">
                <span>고급유</span>
                <span>${premStr}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function focusStationById(id) {
      const st = stationData.find(item => item.id === id);
      if (st) focusStation(st);
    }

    function focusStation(st) {
      selectedStationId = st.id;
      if (st.lat && st.lng) {
        map.setLevel(4);
        map.panTo(new kakao.maps.LatLng(st.lat, st.lng));
      }
      renderMapMarkers();
    }

    function setFuelType(fuel) {
      selectedFuel = fuel;
      document.querySelectorAll('.fuel-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMapMarkers();
      renderStationList();
    }

    function setSortMode(mode) {
      currentSort = mode;
      document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`sort-${mode}`).classList.add('active');
      renderStationList();
    }

    function moveToCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          myLat = pos.coords.latitude;
          myLng = pos.coords.longitude;
          const loc = new kakao.maps.LatLng(myLat, myLng);
          map.setLevel(4);
          map.panTo(loc);
          updateMyLocationMarker(myLat, myLng);
          updateDistances();
          renderStationList();
        }, () => alert("현재 위치를 가져올 수 없습니다. 브라우저 위치 권한을 확인해주세요."));
      }
    }

    // 바텀시트 제스처
    const bottomSheet = document.getElementById('bottom-sheet');
    const dragHandle = document.getElementById('drag-handle');
    const gpsBtn = document.getElementById('gps-btn');
    let isDragging = false, startY = 0, startHeight = 0;

    function startDrag(clientY) {
      isDragging = true;
      startY = clientY;
      startHeight = bottomSheet.offsetHeight;
      document.body.style.userSelect = 'none';
    }

    function onDrag(clientY) {
      if (!isDragging) return;
      const deltaY = startY - clientY;
      const newHeight = Math.min(Math.max(startHeight + deltaY, 130), window.innerHeight * 0.85);
      bottomSheet.style.height = `${newHeight}px`;
      gpsBtn.style.bottom = `${newHeight + 20}px`;
    }

    function stopDrag() {
      if (isDragging) {
        isDragging = false;
        document.body.style.userSelect = '';
      }
    }

    dragHandle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startDrag(e.clientY);
    });
    window.addEventListener('mousemove', (e) => onDrag(e.clientY));
    window.addEventListener('mouseup', stopDrag);

    dragHandle.addEventListener('touchstart', (e) => {
      startDrag(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      onDrag(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', stopDrag);

    initData();
  </script>
</body>
</html>
